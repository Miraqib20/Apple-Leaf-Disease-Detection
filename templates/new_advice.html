{% extends "base.html" %}
{% block title %}Post Advice — Orchard Doctor{% endblock %}
{% block content %}
<div class="page-header">
  <h1>📝 Post Expert Advice</h1>
  <p>Share your knowledge with farmers in the valley</p>
</div>
<div class="form-page">
  <form method="POST" action="{{ url_for('new_advice') }}" class="advice-form">
    <div class="form-group">
      <label>Title</label>
      <input type="text" name="title" required placeholder="e.g. Managing Apple Scab in Wet Season">
    </div>
    <div class="form-group">
      <label>Related Disease (optional)</label>
      <select name="disease_id">
        <option value="">— General Advice —</option>
        {% for d in diseases %}
        <option value="{{ d.id }}">{{ d.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Advice Content</label>
      <textarea name="content" required rows="10" placeholder="Write your detailed advice here..."></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Publish Advice</button>
    <a href="{{ url_for('advice_list') }}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
